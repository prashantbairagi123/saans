<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1C3A44">
<meta name="description" content="SAANS – offline clean-air co-pilot: official AQI engine, sky-eye estimator, pollution source detective, city control simulator and exposure planner.">
<title>SAANS – Offline Clean-Air Co-pilot</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231C3A44'/%3E%3Cpath d='M14 26c8-8 20 8 36-2M14 38c10-8 22 8 36-2' stroke='%237FE0C2' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#15262E;--ink2:#46606B;--mist:#E6EEF0;--paper:#FBFDFD;--line:#D3DEE2;
  --leaf:#1F7A5C;--leaf2:#DDF2EA;--amber:#C9821B;
  --c0:#3BA55C;--c1:#93BF3A;--c2:#E2BC2F;--c3:#EE8424;--c4:#D9452B;--c5:#7A1E2C;
  --cat:#3BA55C;--haze:0;
  --font:"Segoe UI Variable Text","Avenir Next","Inter",Roboto,"Noto Sans","Noto Sans Devanagari","Nirmala UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:#C9DCE3;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#sky{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#8EC3DA 0%,#CFE5EC 55%,#EEF4F2 100%);transition:filter 1.2s}
#haze{position:absolute;inset:0;background:linear-gradient(180deg,#9C8F7C 0%,#BDB3A0 60%,#D4CCBC 100%);opacity:var(--haze);transition:opacity 1.2s}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:84px}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:22px;letter-spacing:-.5px}
.brand svg{width:30px;height:30px}
.top-r{display:flex;gap:8px;align-items:center}
.net{font-size:12px;padding:4px 9px;border-radius:20px;background:rgba(255,255,255,.6);color:var(--ink2)}
.net::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--leaf);margin-right:6px;vertical-align:1px}
.lang{font:inherit;font-weight:700;border:1.5px solid var(--ink);background:transparent;border-radius:10px;padding:4px 10px;cursor:pointer;color:var(--ink)}
main{flex:1;padding:4px 14px 10px}
h1{font-size:26px;letter-spacing:-.6px;line-height:1.15;margin:8px 4px 4px}
h2{font-size:17px;letter-spacing:-.2px;margin:0 0 10px}
.sub{color:var(--ink2);margin:0 4px 14px;font-size:14px}
.panel{background:rgba(251,253,253,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:22px;padding:16px;margin-bottom:12px;border:1px solid rgba(255,255,255,.7)}
.panel.flat{background:rgba(251,253,253,.6)}
.muted{color:var(--ink2);font-size:13px}
.tiny{font-size:12px;color:var(--ink2)}
button{font:inherit;color:inherit}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;cursor:pointer;font-size:14px;transition:background .2s,border-color .2s}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:flex;background:rgba(21,38,46,.08);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 3px rgba(21,38,46,.15)}
:focus-visible{outline:3px solid #2B7FFF;outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--ink);height:28px}
input[type=number],input[type=text],select,textarea{font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:150px;font-size:13.5px;resize:vertical}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.leaf{background:var(--leaf)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
/* orb */
.orbwrap{position:relative;width:270px;height:270px;margin:6px auto 2px}
.orbwrap canvas{width:270px;height:270px;display:block}
.orbtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.aqi{font-size:76px;font-weight:800;letter-spacing:-3px;line-height:1;font-variant-numeric:tabular-nums}
.catname{font-weight:700;font-size:17px;margin-top:4px;padding:3px 12px;border-radius:999px;background:var(--cat);color:#fff}
.pmline{font-size:13px;color:var(--ink2);margin-top:6px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 12px}
.fact{background:rgba(251,253,253,.86);border-radius:16px;padding:10px 10px 9px}
.fact b{display:block;font-size:20px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.fact span{font-size:12px;color:var(--ink2);line-height:1.25;display:block}
.advice li{margin:0 0 7px 18px}
.impact{border-left:4px solid var(--cat);padding:2px 0 2px 10px;margin-bottom:10px;font-weight:600}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pgrid label{font-size:12.5px;color:var(--ink2);display:block}
.pgrid label input{margin-top:3px}
.sib{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.sib i{display:block;height:9px;border-radius:5px;background:var(--ink)}
.sib .lab{width:52px;font-weight:600}
.sib .val{width:36px;text-align:right;font-variant-numeric:tabular-nums}
.sib .track{flex:1;background:rgba(21,38,46,.08);border-radius:5px}
.scene{width:100%;border-radius:16px;display:block;margin-bottom:10px}
/* detect */
.q{margin-bottom:14px}
.q h3{font-size:14px;margin-bottom:7px}
.bar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:9px 0}
.bar .name{font-weight:650;font-size:14.5px}
.bar .pct{font-weight:800;font-variant-numeric:tabular-nums}
.bar .tr{grid-column:1/3;height:10px;border-radius:6px;background:rgba(21,38,46,.08);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.why{font-size:13px;color:var(--ink2);grid-column:1/3}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split h4{font-size:13px;margin-bottom:5px}
.split ul{padding-left:16px;font-size:13.5px}
.saved{font-size:13px;border-top:1px solid var(--line);padding:8px 0}
/* control */
.cmp{display:flex;align-items:center;justify-content:space-around;text-align:center;padding:4px 0 10px}
.cmp .n{font-size:46px;font-weight:800;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
.cmp .c{font-size:12.5px;font-weight:700;color:#fff;border-radius:999px;padding:2px 9px;display:inline-block;margin-top:5px}
.arrow{font-size:26px;color:var(--ink2)}
.stack{display:flex;height:22px;border-radius:8px;overflow:hidden;margin:4px 0;background:rgba(21,38,46,.06)}
.stack i{display:block;height:100%;transition:width .5s}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--k);margin-right:5px}
.lever{padding:10px 0;border-top:1px solid var(--line)}
.lever:first-child{border-top:0}
.lever .row{justify-content:space-between}
.lever b{font-size:14px}
.lever .v{font-variant-numeric:tabular-nums;font-weight:800;min-width:44px;text-align:right}
.insight{background:var(--leaf2);border-radius:16px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.insight b{color:var(--leaf)}
/* plan */
.chart{width:100%;display:block}
.dayrow{display:grid;grid-template-columns:78px 1.3fr .8fr;gap:6px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dayrow select,.dayrow input{padding:6px 6px;font-size:13px;border-radius:10px}
.dayrow .full{grid-column:1/4;display:grid;grid-template-columns:1.2fr 1fr 34px;gap:6px}
.x{border:0;background:transparent;cursor:pointer;font-size:18px;color:var(--ink2)}
.dose{display:flex;align-items:baseline;gap:8px;margin:6px 0}
.dose b{font-size:38px;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
/* act */
.act{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.act:first-of-type{border-top:0}
.tick{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;background:#fff;transition:.2s}
.act[aria-checked="true"] .tick{background:var(--leaf);border-color:var(--leaf)}
.act[aria-checked="true"] .tick::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.act .t{font-weight:650;font-size:14.5px}
.act .s{font-size:12.5px;color:var(--ink2)}
.score{display:flex;gap:10px;margin-bottom:12px}
.score div{flex:1;border-radius:18px;padding:12px;background:var(--ink);color:#fff}
.score b{display:block;font-size:28px;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.score span{font-size:12px;opacity:.8}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{font-size:12.5px;padding:6px 10px;border-radius:12px;background:rgba(21,38,46,.07);color:var(--ink2)}
.badge.on{background:#F7E7C2;color:#6B4A0B;font-weight:700}
.myth{perspective:800px;height:138px;margin-bottom:10px;cursor:pointer}
.myth .in{position:relative;height:100%;transition:transform .6s;transform-style:preserve-3d}
.myth.flip .in{transform:rotateY(180deg)}
.myth .f,.myth .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:14px;display:flex;flex-direction:column;justify-content:center}
.myth .f{background:#fff;border:1.5px dashed #C9B48D}
.myth .b{background:var(--ink);color:#fff;transform:rotateY(180deg);font-size:14px}
.myth .f small,.myth .b small{font-weight:800;font-size:12px;margin-bottom:4px;opacity:.75}
/* nav */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:5;width:min(460px,calc(100% - 20px));display:flex;justify-content:space-around;background:rgba(21,38,46,.94);border-radius:24px;padding:7px 6px;box-shadow:0 10px 30px rgba(21,38,46,.3)}
.tabs button{border:0;background:transparent;color:#A9BEC6;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:650;padding:6px 8px;border-radius:16px;cursor:pointer;min-width:58px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:#fff;background:rgba(255,255,255,.12)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;transition:.3s;z-index:9;pointer-events:none;max-width:90%}
#toast.on{opacity:1;transform:translateX(-50%)}
.view{animation:enter .35s ease}
@keyframes enter{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:900px){
  .app{max-width:480px}
  body::after{content:"";position:fixed}
}
</style>
</head>

/* ---------- CPCB National AQI engine ---------- */
const AQ=[0,50,100,200,300,400,500];
const BP={pm25:[0,30,60,90,120,250,380],pm10:[0,50,100,250,350,430,510],no2:[0,40,80,180,280,400,520],o3:[0,50,100,168,208,748,1000],co:[0,1,2,10,17,34,46],so2:[0,40,80,380,800,1600,2100],nh3:[0,200,400,800,1200,1800,2400]};
const PNAME={pm25:"PM2.5",pm10:"PM10",no2:"NO₂",o3:"O₃",co:"CO",so2:"SO₂",nh3:"NH₃"};
const PUNIT={pm25:"µg/m³",pm10:"µg/m³",no2:"µg/m³",o3:"µg/m³",co:"mg/m³",so2:"µg/m³",nh3:"µg/m³"};
function subIndex(p,c){const b=BP[p];if(c==null||isNaN(c)||c<0)return null;if(c>=b[6])return 500;for(let i=1;i<7;i++)if(c<=b[i])return Math.round(AQ[i-1]+(c-b[i-1])*(AQ[i]-AQ[i-1])/(b[i]-b[i-1]));return 500}
function aqiToPm(a){const b=BP.pm25;for(let i=1;i<7;i++)if(a<=AQ[i])return b[i-1]+(a-AQ[i-1])*(b[i]-b[i-1])/(AQ[i]-AQ[i-1]);return b[6]}
const catOf=a=>a<=50?0:a<=100?1:a<=200?2:a<=300?3:a<=400?4:5;
const CATC=["#3BA55C","#93BF3A","#E2BC2F","#EE8424","#D9452B","#7A1E2C"];
const grapOf=a=>a>450?"IV":a>400?"III":a>300?"II":a>200?"I":"–";
function season(){const m=new Date().getMonth();return m===9||m===10?"sPost":m===11||m<=1?"sWin":m<=5?"sSum":"sMon"}

/* ---------- current reading (derived) ---------- */
function reading(){
  let aqi=S.aqi,pm=aqiToPm(S.aqi),dom="pm25",subs=null;
  if(S.mode==="meter"){subs={};let mx=-1;for(const p in BP){const v=parseFloat(S.meter[p]);const si=subIndex(p,v);if(si!=null){subs[p]=si;if(si>mx){mx=si;dom=p}}}
    if(mx>=0){aqi=mx;pm=parseFloat(S.meter.pm25);if(isNaN(pm))pm=aqiToPm(Math.min(aqi,subs.pm25!=null?subs.pm25:aqi))}else{aqi=0;pm=0;dom=null}}
  if(S.mode==="sky"){pm=skyPm(S.vis,S.rh);aqi=subIndex("pm25",pm)}
  return{aqi:Math.round(aqi),pm:Math.max(0,pm),cat:catOf(aqi),dom,subs}
}
const RHF={dry:1.15,normal:1.45,humidW:1.9,foggy:2.6};
function skyPm(vKm,rh){const b=3912/vKm-13;return clamp(b/(4*RHF[rh]),3,900)}

function applyMood(r){const root=document.documentElement;root.style.setProperty("--cat",CATC[r.cat]);root.style.setProperty("--haze",clamp((r.aqi-60)/420,0,.92).toFixed(2));}

function chips(group,opts,cur,multi){return `<div class="chips" role="group">${opts.map(o=>{const on=multi?(cur||[]).includes(o):cur===o;return `<button class="chip" data-g="${group}" data-v="${o}" aria-pressed="${on}">${esc(t(o))}</button>`}).join("")}</div>`}

/* ================= AIR ================= */
function viewAir(){
  const r=reading();
  let measure="";
  if(S.mode==="dial")measure=`<p class="muted" style="margin-bottom:6px">${t("dialHint")}</p><div class="row"><input type="range" min="0" max="500" value="${S.aqi}" id="dial" aria-label="AQI"><input type="number" min="0" max="500" value="${S.aqi}" id="dialN" style="width:80px" aria-label="AQI value"></div>`;
  if(S.mode==="meter")measure=`<p class="muted" style="margin-bottom:10px">${t("meterHint")}</p><div class="pgrid">${Object.keys(BP).map(p=>`<label>${PNAME[p]} <span class="tiny">${PUNIT[p]}</span><input type="number" min="0" step="any" inputmode="decimal" data-pol="${p}" value="${S.meter[p]??""}" placeholder="–"></label>`).join("")}</div><div id="subs" style="margin-top:10px">${subBars(r)}</div>`;
  if(S.mode==="sky")measure=`<p class="muted" style="margin-bottom:8px">${t("skyHint")}</p>${scene(S.vis)}<div class="row"><span class="tiny" style="min-width:64px">${t("vis")}</span><input type="range" min="0" max="100" value="${Math.round(Math.log(S.vis/0.2)/Math.log(250)*100)}" id="visR" aria-label="Visibility"><b id="visV" style="min-width:58px;text-align:right">${S.vis<1?S.vis.toFixed(1):Math.round(S.vis)} km</b></div><p class="tiny" style="margin:8px 0 6px">${t("humid")}</p>${chips("rh",["dry","normal","humidW","foggy"],S.rh)}<p class="tiny" style="margin-top:10px">${t("skyEst")}</p>`;
  return `<div class="view">
  <div class="orbwrap"><canvas id="orb" width="540" height="540" aria-hidden="true"></canvas>
   <div class="orbtxt"><div class="aqi" id="aqiN">${r.aqi}</div><div class="catname" id="catN">${t("cat"+r.cat)}</div><div class="pmline" id="pmL">PM2.5 ≈ ${Math.round(r.pm)} µg/m³ · AQI</div></div></div>
  <div class="facts">
   <div class="fact"><b id="fCig">${(r.pm/22).toFixed(1)}</b><span>${t("cig")}</span></div>
   <div class="fact"><b id="fGrap">${grapOf(r.aqi)}</b><span>${t("grap")}</span></div>
   <div class="fact"><b id="fDom">${r.dom?PNAME[r.dom]:t("none")}</b><span>${t("dom")}</span></div>
  </div>
  <section class="panel">
   <div class="seg" role="group">${[["dial","mDial"],["meter","mMeter"],["sky","mSky"]].map(([m,k])=>`<button data-mode="${m}" aria-pressed="${S.mode===m}">${t(k)}</button>`).join("")}</div>
   ${measure}
  </section>
  <section class="panel"><h2>${t("who")}</h2>${chips("profile",["pGen","pChild","pOld","pAsth","pPreg","pWork"],S.profile)}</section>
  <section class="panel" id="advice">${adviceHtml(r)}</section>
  </div>`;
}
function subBars(r){if(!r.subs||!Object.keys(r.subs).length)return"";return Object.entries(r.subs).sort((a,b)=>b[1]-a[1]).map(([p,v])=>`<div class="sib"><span class="lab">${PNAME[p]}</span><span class="track"><i style="width:${v/5}%;background:${CATC[catOf(v)]}"></i></span><span class="val">${v}</span></div>`).join("")}
function scene(v){
  const haze="#C7C2B5",far=[["#5F7F8C",20,40],["#557584",8,62],["#4A6A78",3,84],["#3E5C69",1,108]];
  const mix=(a,b,f)=>{const pa=a.match(/\w\w/g).map(x=>parseInt(x,16)),pb=b.match(/\w\w/g).map(x=>parseInt(x,16));return "rgb("+pa.map((x,i)=>Math.round(x*(1-f)+pb[i]*f)).join(",")+")"};
  const sky=mix("#7DB8D6",haze,clamp(1-v/25,0,1));
  const ridges=far.map(([c,d,y],i)=>{const f=1-Math.exp(-3.912*d/v);const pts=[];for(let x=0;x<=320;x+=20)pts.push(`${x},${y-10-14*Math.sin(x/37+i*1.7)-8*Math.cos(x/23+i)}`);return `<path d="M0,170 L${pts.join(" L")} L320,170Z" fill="${mix(c.slice(1),haze.slice(1),clamp(f,0,1))}"/>`}).join("");
  const tw=1-Math.exp(-3.912*3/v);
  return `<svg class="scene" viewBox="0 0 320 150" role="img" aria-label="Visibility preview"><rect width="320" height="150" fill="${sky}"/>${ridges}<g fill="${mix("2E4650",haze.slice(1),clamp(tw,0,1))}"><rect x="210" y="58" width="10" height="40"/><rect x="224" y="46" width="12" height="52"/><rect x="240" y="66" width="9" height="32"/></g><rect y="128" width="320" height="22" fill="#3B4F44"/><text x="10" y="18" font-size="11" fill="#fff" opacity=".85">20 km · 8 km · 3 km · 1 km</text></svg>`;
}

function detScores(){

  keys.forEach(k=>{const e=EV[k]||{};for(const s in e){sc[s]+=e[s]*.5;if(e[s]>=1)why[s].push(t(k))}});
  if(pr.stub>=2)why.stub.unshift(t(sea));if(pr.dust>=2)why.dust.unshift(t(sea));
  const mx=Math.max(...SRC.map(s=>sc[s]));let tot=0;SRC.forEach(s=>{sc[s]=Math.exp(sc[s]-mx);tot+=sc[s]});
  return SRC.map(s=>({s,p:sc[s]/tot,why:why[s]})).sort((a,b)=>b.p-a.p);
}

  const bar=o=>`<div class="stack">${Object.keys(s.mix).map(k=>`<i style="width:${o[k]}%;background:${SRCC[k]}" title="${t(SK2[k])}"></i>`).join("")}</div>`;
  const risk=Math.max(0,(s.r.pm-s.pm2)/22);
  return `<div class="cmp"><div><div class="tiny">${t("now")}</div><div class="n">${s.r.aqi}</div><span class="c" style="background:${CATC[c1]}">${t("cat"+c1)}</span></div><div class="arrow" aria-hidden="true">➜</div><div><div class="tiny">${t("after")}</div><div class="n" style="color:${CATC[c2]}">${s.aqi2}</div><span class="c" style="background:${CATC[c2]}">${t("cat"+c2)}</span></div></div>
  <h2 style="font-size:14px;margin-top:4px">${t("srcMix")}</h2>${bar(s.mix)}${bar(s.after)}
  <div class="legend">${Object.keys(s.mix).map(k=>`<span style="--k:${SRCC[k]}">${t(SK2[k])}</span>`).join("")}</div>
  <div class="insight" style="margin:12px 0 0"><b>${t("bestLever")}</b> ${t(LV[s.best])} (−${Math.round(s.bv)}% PM2.5)<br><b>${t("health")}</b> ${risk.toFixed(1)} ${t("healthTail")}</div>
  <p class="tiny" style="margin-top:8px">${t("mixNote")} PM2.5: ${Math.round(s.r.pm)} → ${Math.round(s.pm2)} µg/m³</p>`}

/* ================= PLAN ================= */
const DIUR={win:[1.25,1.3,1.32,1.3,1.28,1.3,1.35,1.42,1.38,1.2,1,.84,.72,.65,.62,.64,.72,.88,1.05,1.18,1.25,1.3,1.3,1.28],sum:[1.08,1.1,1.1,1.1,1.1,1.12,1.18,1.2,1.12,1,.92,.86,.82,.8,.8,.82,.86,.94,1.02,1.08,1.1,1.1,1.1,1.08]};
function diur(){const s=season();const a=(s==="sPost"||s==="sWin")?DIUR.win:DIUR.sum;const m=a.reduce((x,y)=>x+y)/24;return a.map(v=>v/m)}
const RATE={aSleep:.3,aSit:.5,aWalk:1.1,aCycle:1.8,aRun:3};
const WHERE={wOut:1,wOpen:.85,wClosed:.55,wPur:.22,wCar:.4};
const MASK={mkNone:0,mkCloth:.25,mkSurg:.45,mkN95:.9};
const DEFDAY=[{h:7,d:1,a:"aRun",w:"wOut",m:"mkNone"},{h:9,d:7,a:"aSit",w:"wClosed",m:"mkNone"},{h:18,d:1,a:"aWalk",w:"wOut",m:"mkNone"},{h:22,d:8,a:"aSleep",w:"wClosed",m:"mkNone"}];
function bestWindow(){const f=diur();let b=6,bv=1e9,w=6,wv=-1;for(let h=6;h<=20;h++){const v=f[h]+f[h+1];if(v<bv){bv=v;b=h}if(v>wv){wv=v;w=h}}return{b,w,f}}
function doseOf(row,pm,f,hStart){let s=0;const h0=hStart??row.h;for(let i=0;i<row.d;i+=.5){const hh=Math.floor(h0+i)%24;s+=pm*f[hh]*.5}return s*WHERE[row.w]*RATE[row.a]*(1-MASK[row.m])}
const hh=h=>String(h%24).padStart(2,"0")+":00";
function viewPlan(){if(!S.day)S.day=JSON.parse(JSON.stringify(DEFDAY));
  return `<div class="view"><h1>${t("planH")}</h1><p class="sub">${t("planS")}</p>
  <section class="panel" id="curve">${curveHtml()}</section>
  <section class="panel"><h2>${t("myDay")}</h2><div id="rows">${rowsHtml()}</div><button class="btn ghost" id="addRow" style="width:100%">${t("add")}</button><div id="doseBox" style="margin-top:12px">${doseHtml()}</div></section>
  <section class="panel"><h2>${t("purH")}</h2><p class="tiny" style="margin-bottom:6px">${t("room")}</p><div class="row">${S.room.map((v,i)=>`<input type="number" min="1" max="30" step="0.5" value="${v}" data-room="${i}" aria-label="room dimension ${i+1}">`).join("")}</div><div id="cadr" style="margin-top:10px">${cadrHtml()}</div></section></div>`}
function curveHtml(){const{b,w,f}=bestWindow(),pm=reading().pm,W=320,H=120,mx=Math.max(...f)*1.08;
  const X=h=>h/23*W,Y=v=>H-v/mx*H;let p=`M0,${Y(f[0])}`;f.forEach((v,h)=>{p+=` L${X(h)},${Y(v)}`});
  const ticks=[0,6,12,18,23].map(h=>`<text x="${X(h)}" y="${H+14}" font-size="10" fill="#46606B" text-anchor="${h===0?"start":h===23?"end":"middle"}">${hh(h)}</text>`).join("");
  return `<svg class="chart" viewBox="0 -6 320 140" role="img" aria-label="PM2.5 through the day"><path d="${p} L${W},${H} L0,${H}Z" fill="#15262E" opacity=".07"/><rect x="${X(b)}" y="0" width="${X(2)}" height="${H}" fill="#1F7A5C" opacity=".28" rx="6"/><rect x="${X(w)}" y="0" width="${X(2)}" height="${H}" fill="#D9452B" opacity=".22" rx="6"/><path d="${p}" fill="none" stroke="#15262E" stroke-width="2.2"/>${ticks}</svg>
  <div class="row" style="margin-top:8px"><div class="grow"><div class="tiny">${t("bestWin")}</div><b style="color:var(--leaf);font-size:18px">${hh(b)}–${hh(b+2)}</b> <span class="tiny">≈${Math.round(pm*f[b])} µg/m³</span></div><div class="grow"><div class="tiny">${t("worstWin")}</div><b style="color:var(--c4);font-size:18px">${hh(w)}–${hh(w+2)}</b> <span class="tiny">≈${Math.round(pm*f[w])} µg/m³</span></div></div>`}
function opt(map,cur){return Object.keys(map).map(k=>`<option value="${k}" ${k===cur?"selected":""}>${esc(t(k))}</option>`).join("")}
function rowsHtml(){return S.day.map((r,i)=>`<div class="dayrow"><select data-row="${i}" data-k="h" aria-label="start">${Array.from({length:24},(_,h)=>`<option value="${h}" ${h===r.h?"selected":""}>${hh(h)}</option>`).join("")}</select><select data-row="${i}" data-k="a">${opt(RATE,r.a)}</select><select data-row="${i}" data-k="d" aria-label="hours">${[.5,1,2,3,4,6,7,8,9,10].map(v=>`<option value="${v}" ${v==r.d?"selected":""}>${v} h</option>`).join("")}</select><div class="full"><select data-row="${i}" data-k="w">${opt(WHERE,r.w)}</select><select data-row="${i}" data-k="m">${opt(MASK,r.m)}</select><button class="x" data-del="${i}" aria-label="remove">×</button></div></div>`).join("")}
function doseHtml(){const pm=reading().pm,{b,f}=bestWindow();let tot=0,tip=null,ts=0;
  S.day.forEach(r=>{const d=doseOf(r,pm,f);tot+=d;if(r.w==="wOut"&&r.d<=3){const alt=doseOf(r,pm,f,b);if(d-alt>ts){ts=d-alt;tip=r}}});
  const clean=15*13.5;const x=tot/clean;
  return `<div class="dose"><b>${Math.round(tot).toLocaleString("en-IN")}</b><span class="muted">${t("doseL")}</span></div><div class="muted">${x.toFixed(1)} ${t("vsClean")} (15 µg/m³ × 13.5 m³)</div>${tip&&ts/tot>.03?`<div class="insight" style="margin-top:10px"><b>${t("tipMove")}</b> ${esc(t(tip.a))} ${hh(tip.h)} ${t("tipTo")} ${hh(b)} ${t("tipSave")} ${Math.round(ts/tot*100)}%</div>`:""}`}
function cadrHtml(){const v=S.room.reduce((a,b)=>a*b,1),c=v*5;return `<div class="dose"><b>${Math.round(c)}</b><span class="muted">m³/h (${Math.round(c/1.699)} CFM)</span></div><div class="muted">${t("cadr")} · ${v.toFixed(1)} m³</div>`}

/* ================= ACT ================= */
const ACTL=[["a1",15,2],["a2",5,.1],["a3",10,.5],["a4",20,0],["a5",10,1],["a6",5,.3],["a7",15,0],["a8",10,0]];
const MYTHS=[["Indoor plants clean polluted air.","You'd need hundreds of plants per room to match a small purifier. Plants are lovely – not air cleaners."],["A morning walk gives the freshest air in winter.","In winter, an inversion traps smoke near the ground until ~10 am. Afternoons are usually cleaner."],["Cloth masks stop PM2.5.","Loose cloth masks filter only a small share of fine particles. A well-fitted N95 blocks about 95%."],["Smog towers can clean a city.","A tower cleans only a small zone around it. Cutting emissions at the source works far better."],["Closing windows keeps all smoke out.","Fine particles leak in. Closed rooms run at roughly half the outdoor level; a purifier is needed for more."],["Air pollution only hurts the lungs.","PM2.5 enters the bloodstream; it raises risk of heart attack, stroke, diabetes and low birth weight."]];
const MYTHSHI=[["घर के पौधे प्रदूषित हवा साफ़ करते हैं।","एक छोटे प्यूरीफ़ायर जितना असर पाने के लिए सैकड़ों पौधे चाहिए। पौधे सुंदर हैं, एयर क्लीनर नहीं।"],["सर्दियों में सुबह की सैर सबसे साफ़ हवा देती है।","सर्दियों में इन्वर्ज़न सुबह ~10 बजे तक धुआँ ज़मीन के पास रोकता है। दोपहर अक्सर साफ़ होती है।"],["कपड़े का मास्क PM2.5 रोकता है।","ढीला कपड़े का मास्क बारीक कण कम रोकता है। सही फ़िट N95 लगभग 95% रोकता है।"],["स्मॉग टावर पूरा शहर साफ़ कर सकते हैं।","टावर केवल आसपास का छोटा क्षेत्र साफ़ करता है। स्रोत पर उत्सर्जन घटाना कहीं बेहतर है।"],["खिड़कियाँ बंद करने से धुआँ नहीं आता।","बारीक कण अंदर आ जाते हैं। बंद कमरे में बाहर का लगभग आधा स्तर रहता है।"],["वायु प्रदूषण केवल फेफड़ों को नुकसान करता है।","PM2.5 ख़ून में पहुँचता है; हृदयाघात, स्ट्रोक, मधुमेह और कम जन्म-भार का जोखिम बढ़ाता है।"]];
const today=()=>new Date().toISOString().slice(0,10);
function actStats(){const days=Object.keys(S.hist).sort();let pts=0,co2=0;days.forEach(d=>(S.hist[d]||[]).forEach(k=>{const a=ACTL.find(x=>x[0]===k);if(a){pts+=a[1];co2+=a[2]}}));
  let st=0;const dt=new Date();for(;;){const k=dt.toISOString().slice(0,10);if((S.hist[k]||[]).length){st++;dt.setDate(dt.getDate()-1)}else break}
  const rep=Object.values(S.hist).some(v=>v.includes("a4"));return{pts,co2,st,rep}}
function viewAct(){const done=S.hist[today()]||[],s=actStats(),hi=S.lang==="hi";const M=hi?MYTHSHI:MYTHS;
  const b=[["b1",s.pts>0],["b2",s.st>=7],["b3",s.rep],["b4",s.pts>=100]];
  return `<div class="view"><h1>${t("actH")}</h1><p class="sub">${t("actS")}</p>
  <div class="score"><div><b>${s.pts}</b><span>${t("pts")}</span></div><div style="background:var(--leaf)"><b>${s.st}</b><span>${t("streak")}</span></div><div style="background:#fff;color:var(--ink)"><b>${s.co2.toFixed(1)}</b><span>${t("co2")}</span></div></div>
  <section class="panel">${ACTL.map(([k,p])=>`<div class="act" role="checkbox" tabindex="0" data-act="${k}" aria-checked="${done.includes(k)}"><span class="tick"></span><div class="grow"><div class="t">${t(k)}</div><div class="s">${t(k+"s")}</div></div><b class="tiny">+${p}</b></div>`).join("")}</section>
  <section class="panel"><h2>${t("badgesT")}</h2><div class="badges">${b.map(([k,on])=>`<span class="badge ${on?"on":""}">${on?"★ ":""}${t(k)}</span>`).join("")}</div></section>
  <h2 style="margin:16px 4px 10px">${t("mythsT")}</h2>
  ${M.map((m,i)=>`<div class="myth ${S.myths[i]?"flip":""}" data-myth="${i}" role="button" tabindex="0" aria-label="${esc(m[0])}"><div class="in"><div class="f"><small>${t("myth")}?</small><b>${esc(m[0])}</b></div><div class="b"><small>${t("fact")}</small>${esc(m[1])}</div></div></div>`).join("")}
  </div>`}

/* ---------- router & events ---------- */
const VIEWS={air:viewAir,detect:viewDetect,control:viewControl,plan:viewPlan,act:viewAct};
function render(){renderTabs();document.documentElement.lang=S.lang==="hi"?"hi":"en";$("#lang").textContent=S.lang==="hi"?"EN":"हिं";
  $("#view").innerHTML=VIEWS[S.tab]();applyMood(reading());if(S.tab==="air"){orb.target=reading();if(!orb.raf)orb.raf=requestAnimationFrame(orbLoop)}net();save()}
function go(tab){S.tab=tab;try{history.replaceState(null,"","#"+tab)}catch(e){}render();window.scrollTo({top:0})}
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}
function net(){$("#net").textContent=navigator.onLine?t("online"):t("offline")}
addEventListener("online",net);addEventListener("offline",net);
$("#lang").onclick=()=>{S.lang=S.lang==="hi"?"en":"hi";render()};
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-tab],[data-mode],[data-g],[data-preset],[data-act],[data-myth],[data-del],#addRow,#copyC,#saveC");if(!el)return;
  if(el.dataset.tab)return go(el.dataset.tab);
  if(el.dataset.mode){S.mode=el.dataset.mode;return render()}
  if(el.dataset.g){const g=el.dataset.g,v=el.dataset.v;
    if(g==="profile"){S.profile=v;save();document.querySelectorAll('[data-g="profile"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));return updAir()}
    if(g==="rh"){S.rh=v;save();document.querySelectorAll('[data-g="rh"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));return updAir()}
    if(g==="near"){const a=S.det.near||[];S.det.near=a.includes(v)?a.filter(x=>x!==v):[...a,v]}else S.det[g]=S.det[g]===v&&g!=="season"?null:v;
    document.querySelectorAll(`[data-g="${g}"]`).forEach(b=>b.setAttribute("aria-pressed",g==="near"?S.det.near.includes(b.dataset.v):b.dataset.v===S.det[g]));
    $("#detRes").innerHTML=detResult();$("#cmp").value=complaint();return save()}
  if(el.dataset.preset){Object.assign(S.levers,PRESET[el.dataset.preset]);return render()}
  if(el.dataset.act)return toggleAct(el);
  if(el.dataset.myth!=null){el.classList.toggle("flip");S.myths[el.dataset.myth]=el.classList.contains("flip");return save()}
  if(el.dataset.del!=null){S.day.splice(+el.dataset.del,1);$("#rows").innerHTML=rowsHtml();$("#doseBox").innerHTML=doseHtml();return save()}
  if(el.id==="addRow"){S.day.push({h:16,d:1,a:"aWalk",w:"wOut",m:"mkNone"});$("#rows").innerHTML=rowsHtml();$("#doseBox").innerHTML=doseHtml();return save()}
  if(el.id==="copyC"){const v=$("#cmp").value;try{navigator.clipboard.writeText(v).then(()=>toast(t("copied")),()=>{$("#cmp").select();toast(t("copyFail"))})}catch(x){$("#cmp").select();toast(t("copyFail"))}return}
  if(el.id==="saveC"){const top=detScores()[0];S.reports.push({when:new Date().toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"}),src:T.en[SRCK[top.s]],loc:S.det.loc||"",text:$("#cmp").value});save();$("#savedList").innerHTML=savedHtml();return toast(t("savedOk"))}
});
function toggleAct(el){const k=el.dataset.act,d=today(),a=S.hist[d]||[];S.hist[d]=a.includes(k)?a.filter(x=>x!==k):[...a,k];save();render();const n=document.querySelector(`[data-act="${k}"]`);if(n)n.focus()}
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-act],[data-myth]")){e.preventDefault();e.target.click()}});
document.addEventListener("input",e=>{const el=e.target;
  if(el.id==="dial"||el.id==="dialN"){S.aqi=clamp(parseInt(el.value)||0,0,500);const o=el.id==="dial"?$("#dialN"):$("#dial");o.value=S.aqi;updAir();return save()}
  if(el.dataset.pol){S.meter[el.dataset.pol]=el.value;updAir();return save()}
  if(el.id==="visR"){S.vis=+(0.2*Math.pow(250,el.value/100)).toFixed(2);$("#visV").textContent=(S.vis<1?S.vis.toFixed(1):Math.round(S.vis))+" km";const sc=document.querySelector(".scene");sc.outerHTML=scene(S.vis);updAir();return save()}
  if(el.dataset.lever){S.levers[el.dataset.lever]=+el.value;$("#lv_"+el.dataset.lever).textContent=el.value+"%";$("#simTop").innerHTML=simTop();return save()}
  if(el.dataset.row!=null){const r=S.day[+el.dataset.row],k=el.dataset.k;r[k]=(k==="h"||k==="d")?+el.value:el.value;$("#doseBox").innerHTML=doseHtml();return save()}
  if(el.dataset.room!=null){S.room[+el.dataset.room]=clamp(+el.value||1,1,30);$("#cadr").innerHTML=cadrHtml();return save()}
  if(el.id==="locIn"){S.det.loc=el.value;$("#cmp").value=complaint();return save()}
});
const h0=(location.hash||"").slice(1);if(VIEWS[h0])S.tab=h0;
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==S.tab)go(h)});
render();

</script>
</body>
</html>
