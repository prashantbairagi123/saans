<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1C3A44">
<meta name="description" content="SAANS – offline clean-air co-pilot: official AQI engine, sky-eye estimator, pollution source detective, city control simulator and exposure planner.">
<title>SAANS – Offline Clean-Air Co-pilot</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231C3A44'/%3E%3Cpath d='M14 26c8-8 20 8 36-2M14 38c10-8 22 8 36-2' stroke='%237FE0C2' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#15262E;--ink2:#46606B;--mist:#E6EEF0;--paper:#FBFDFD;--line:#D3DEE2;
  --leaf:#1F7A5C;--leaf2:#DDF2EA;--amber:#C9821B;
  --c0:#3BA55C;--c1:#93BF3A;--c2:#E2BC2F;--c3:#EE8424;--c4:#D9452B;--c5:#7A1E2C;
  --cat:#3BA55C;--haze:0;
  --font:"Segoe UI Variable Text","Avenir Next","Inter",Roboto,"Noto Sans","Noto Sans Devanagari","Nirmala UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:#C9DCE3;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#sky{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#8EC3DA 0%,#CFE5EC 55%,#EEF4F2 100%);transition:filter 1.2s}
#haze{position:absolute;inset:0;background:linear-gradient(180deg,#9C8F7C 0%,#BDB3A0 60%,#D4CCBC 100%);opacity:var(--haze);transition:opacity 1.2s}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:84px}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:22px;letter-spacing:-.5px}
.brand svg{width:30px;height:30px}
.top-r{display:flex;gap:8px;align-items:center}
.net{font-size:12px;padding:4px 9px;border-radius:20px;background:rgba(255,255,255,.6);color:var(--ink2)}
.net::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--leaf);margin-right:6px;vertical-align:1px}
.lang{font:inherit;font-weight:700;border:1.5px solid var(--ink);background:transparent;border-radius:10px;padding:4px 10px;cursor:pointer;color:var(--ink)}
main{flex:1;padding:4px 14px 10px}
h1{font-size:26px;letter-spacing:-.6px;line-height:1.15;margin:8px 4px 4px}
h2{font-size:17px;letter-spacing:-.2px;margin:0 0 10px}
.sub{color:var(--ink2);margin:0 4px 14px;font-size:14px}
.panel{background:rgba(251,253,253,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:22px;padding:16px;margin-bottom:12px;border:1px solid rgba(255,255,255,.7)}
.panel.flat{background:rgba(251,253,253,.6)}
.muted{color:var(--ink2);font-size:13px}
.tiny{font-size:12px;color:var(--ink2)}
button{font:inherit;color:inherit}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;cursor:pointer;font-size:14px;transition:background .2s,border-color .2s}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:flex;background:rgba(21,38,46,.08);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 3px rgba(21,38,46,.15)}
:focus-visible{outline:3px solid #2B7FFF;outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--ink);height:28px}
input[type=number],input[type=text],select,textarea{font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:150px;font-size:13.5px;resize:vertical}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.leaf{background:var(--leaf)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
/* orb */
.orbwrap{position:relative;width:270px;height:270px;margin:6px auto 2px}
.orbwrap canvas{width:270px;height:270px;display:block}
.orbtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.aqi{font-size:76px;font-weight:800;letter-spacing:-3px;line-height:1;font-variant-numeric:tabular-nums}
.catname{font-weight:700;font-size:17px;margin-top:4px;padding:3px 12px;border-radius:999px;background:var(--cat);color:#fff}
.pmline{font-size:13px;color:var(--ink2);margin-top:6px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 12px}
.fact{background:rgba(251,253,253,.86);border-radius:16px;padding:10px 10px 9px}
.fact b{display:block;font-size:20px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.fact span{font-size:12px;color:var(--ink2);line-height:1.25;display:block}
.advice li{margin:0 0 7px 18px}
.impact{border-left:4px solid var(--cat);padding:2px 0 2px 10px;margin-bottom:10px;font-weight:600}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pgrid label{font-size:12.5px;color:var(--ink2);display:block}
.pgrid label input{margin-top:3px}
.sib{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.sib i{display:block;height:9px;border-radius:5px;background:var(--ink)}
.sib .lab{width:52px;font-weight:600}
.sib .val{width:36px;text-align:right;font-variant-numeric:tabular-nums}
.sib .track{flex:1;background:rgba(21,38,46,.08);border-radius:5px}
.scene{width:100%;border-radius:16px;display:block;margin-bottom:10px}
/* detect */
.q{margin-bottom:14px}
.q h3{font-size:14px;margin-bottom:7px}
.bar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:9px 0}
.bar .name{font-weight:650;font-size:14.5px}
.bar .pct{font-weight:800;font-variant-numeric:tabular-nums}
.bar .tr{grid-column:1/3;height:10px;border-radius:6px;background:rgba(21,38,46,.08);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.why{font-size:13px;color:var(--ink2);grid-column:1/3}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split h4{font-size:13px;margin-bottom:5px}
.split ul{padding-left:16px;font-size:13.5px}
.saved{font-size:13px;border-top:1px solid var(--line);padding:8px 0}
/* control */
.cmp{display:flex;align-items:center;justify-content:space-around;text-align:center;padding:4px 0 10px}
.cmp .n{font-size:46px;font-weight:800;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
.cmp .c{font-size:12.5px;font-weight:700;color:#fff;border-radius:999px;padding:2px 9px;display:inline-block;margin-top:5px}
.arrow{font-size:26px;color:var(--ink2)}
.stack{display:flex;height:22px;border-radius:8px;overflow:hidden;margin:4px 0;background:rgba(21,38,46,.06)}
.stack i{display:block;height:100%;transition:width .5s}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--k);margin-right:5px}
.lever{padding:10px 0;border-top:1px solid var(--line)}
.lever:first-child{border-top:0}
.lever .row{justify-content:space-between}
.lever b{font-size:14px}
.lever .v{font-variant-numeric:tabular-nums;font-weight:800;min-width:44px;text-align:right}
.insight{background:var(--leaf2);border-radius:16px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.insight b{color:var(--leaf)}
/* plan */
.chart{width:100%;display:block}
.dayrow{display:grid;grid-template-columns:78px 1.3fr .8fr;gap:6px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dayrow select,.dayrow input{padding:6px 6px;font-size:13px;border-radius:10px}
.dayrow .full{grid-column:1/4;display:grid;grid-template-columns:1.2fr 1fr 34px;gap:6px}
.x{border:0;background:transparent;cursor:pointer;font-size:18px;color:var(--ink2)}
.dose{display:flex;align-items:baseline;gap:8px;margin:6px 0}
.dose b{font-size:38px;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
/* act */
.act{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.act:first-of-type{border-top:0}
.tick{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;background:#fff;transition:.2s}
.act[aria-checked="true"] .tick{background:var(--leaf);border-color:var(--leaf)}
.act[aria-checked="true"] .tick::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.act .t{font-weight:650;font-size:14.5px}
.act .s{font-size:12.5px;color:var(--ink2)}
.score{display:flex;gap:10px;margin-bottom:12px}
.score div{flex:1;border-radius:18px;padding:12px;background:var(--ink);color:#fff}
.score b{display:block;font-size:28px;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.score span{font-size:12px;opacity:.8}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{font-size:12.5px;padding:6px 10px;border-radius:12px;background:rgba(21,38,46,.07);color:var(--ink2)}
.badge.on{background:#F7E7C2;color:#6B4A0B;font-weight:700}
.myth{perspective:800px;height:138px;margin-bottom:10px;cursor:pointer}
.myth .in{position:relative;height:100%;transition:transform .6s;transform-style:preserve-3d}
.myth.flip .in{transform:rotateY(180deg)}
.myth .f,.myth .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:14px;display:flex;flex-direction:column;justify-content:center}
.myth .f{background:#fff;border:1.5px dashed #C9B48D}
.myth .b{background:var(--ink);color:#fff;transform:rotateY(180deg);font-size:14px}
.myth .f small,.myth .b small{font-weight:800;font-size:12px;margin-bottom:4px;opacity:.75}
/* nav */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:5;width:min(460px,calc(100% - 20px));display:flex;justify-content:space-around;background:rgba(21,38,46,.94);border-radius:24px;padding:7px 6px;box-shadow:0 10px 30px rgba(21,38,46,.3)}
.tabs button{border:0;background:transparent;color:#A9BEC6;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:650;padding:6px 4px;border-radius:16px;cursor:pointer;min-width:50px;flex:1}
.tabs button.hot{color:#7FE0C2}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:#fff;background:rgba(255,255,255,.12)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;transition:.3s;z-index:9;pointer-events:none;max-width:90%}
#toast.on{opacity:1;transform:translateX(-50%)}
.view{animation:enter .35s ease}
@keyframes enter{from{opacity:0;transform:translateY(6px)}}
/* v2: header tools, verdict, listen, ask, tour */
.hbtn{font:inherit;font-weight:800;font-size:13px;border:1.5px solid var(--ink);background:transparent;border-radius:10px;padding:4px 7px;cursor:pointer;color:var(--ink);min-width:30px}
.hbtn[aria-pressed="true"]{background:var(--ink);color:#fff}
html.big .app{zoom:1.14}html.big .tabs{zoom:1.06}
.verd{display:flex;gap:12px;align-items:center;border-radius:16px;padding:12px 14px;margin:6px 0 10px;color:#fff}
.verd .vi{font-size:28px;line-height:1;flex:none}
.verd b{display:block;font-size:18px;letter-spacing:-.2px}
.verd span{font-size:13.5px;opacity:.96;display:block}
.v0{background:#1F7A5C}.v1{background:#A8650F}.v2{background:#B3261E}
.say{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.say.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.hrow h2{margin:0}
.h3{font-size:14px;margin:10px 0 6px}
.askbox{display:flex;gap:6px;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:5px 5px 5px 12px;align-items:center}
.askbox input{border:0;padding:8px 2px;font-size:15.5px;background:transparent;min-width:0;flex:1;width:100%;font:inherit;color:var(--ink)}
.askbox input:focus-visible{outline:none}
.askbox:focus-within{box-shadow:0 0 0 3px rgba(43,127,255,.35)}
.ibtn{border:0;border-radius:13px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;background:rgba(21,38,46,.08);flex:none}
.ibtn.go{background:var(--ink);color:#fff}
.ibtn svg{width:20px;height:20px}
.ibtn.rec{background:#D9452B;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.ex{display:flex;flex-wrap:wrap;gap:7px}
.ex button{border:1.5px solid var(--line);background:rgba(255,255,255,.92);border-radius:14px;padding:8px 11px;font-size:13.5px;text-align:left;cursor:pointer}
.und{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 2px 10px;font-size:12.5px}
.und b{font-size:12px;color:var(--ink2);margin-right:2px}
.ent{background:var(--leaf2);color:var(--leaf);border-radius:999px;padding:3px 9px;font-weight:700}
.ent.fix{background:#FCEFD9;color:#7A4A06}
.ent.w{background:rgba(21,38,46,.07);color:var(--ink2)}
.big3{display:flex;align-items:center;gap:12px;margin:2px 0 4px}
.big3 b{font-size:54px;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;margin:2px 0 8px}
.steps{background:rgba(21,38,46,.05);border-radius:12px;padding:10px 12px;font-size:12.5px;font-family:ui-monospace,"DejaVu Sans Mono",monospace;line-height:1.65;margin:8px 0;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:12px}
.kind{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--leaf)}
.rel{border-top:1px solid var(--line);padding:9px 0}
.rel summary{cursor:pointer;font-weight:650;font-size:14px}
.rel p{font-size:13.5px;color:var(--ink2);margin-top:6px}
.stat{font-size:12px;color:var(--ink2);text-align:center;margin:4px 0 6px}
#tour{position:fixed;inset:0;z-index:20;background:rgba(21,38,46,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px}
#tour .card{background:#fff;border-radius:24px;max-width:440px;width:100%;padding:22px 20px 18px;margin-bottom:8px;animation:enter .3s}
#tour .dots{display:flex;gap:6px;margin-bottom:12px}#tour .dots i{width:22px;height:5px;border-radius:3px;background:var(--line)}#tour .dots i.on{background:var(--ink)}
#tour h2{font-size:21px;margin-bottom:6px}
#tour p{color:var(--ink2);font-size:15px}
#tour .ill{font-size:42px;margin-bottom:6px;line-height:1}
@media (max-width:370px){.net{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:900px){
  .app{max-width:480px}
  body::after{content:"";position:fixed}
}
</style>
</head>

  <main id="view"></main>
</div>

function subIndex(p,c){const b=BP[p];if(c==null||isNaN(c)||c<0)return null;if(c>=b[6])return 500;for(let i=1;i<7;i++)if(c<=b[i])return Math.round(AQ[i-1]+(c-b[i-1])*(AQ[i]-AQ[i-1])/(b[i]-b[i-1]));return 500}
function aqiToPm(a){const b=BP.pm25;for(let i=1;i<7;i++)if(a<=AQ[i])return b[i-1]+(a-AQ[i-1])*(b[i]-b[i-1])/(AQ[i]-AQ[i-1]);return b[6]}
const catOf=a=>a<=50?0:a<=100?1:a<=200?2:a<=300?3:a<=400?4:5;
const CATC=["#3BA55C","#93BF3A","#E2BC2F","#EE8424","#D9452B","#7A1E2C"];
const grapOf=a=>a>450?"IV":a>400?"III":a>300?"II":a>200?"I":"–";
function season(){const m=new Date().getMonth();return m===9||m===10?"sPost":m===11||m<=1?"sWin":m<=5?"sSum":"sMon"}

/* ---------- current reading (derived) ---------- */
function reading(){
  let aqi=S.aqi,pm=aqiToPm(S.aqi),dom="pm25",subs=null;
  if(S.mode==="meter"){subs={};let mx=-1;for(const p in BP){const v=parseFloat(S.meter[p]);const si=subIndex(p,v);if(si!=null){subs[p]=si;if(si>mx){mx=si;dom=p}}}
    if(mx>=0){aqi=mx;pm=parseFloat(S.meter.pm25);if(isNaN(pm))pm=aqiToPm(Math.min(aqi,subs.pm25!=null?subs.pm25:aqi))}else{aqi=0;pm=0;dom=null}}
  if(S.mode==="sky"){pm=skyPm(S.vis,S.rh);aqi=subIndex("pm25",pm)}
  return{aqi:Math.round(aqi),pm:Math.max(0,pm),cat:catOf(aqi),dom,subs}
}
const RHF={dry:1.15,normal:1.45,humidW:1.9,foggy:2.6};
function skyPm(vKm,rh){const b=3912/vKm-13;return clamp(b/(4*RHF[rh]),3,900)}

function subBars(r){if(!r.subs||!Object.keys(r.subs).length)return"";return Object.entries(r.subs).sort((a,b)=>b[1]-a[1]).map(([p,v])=>`<div class="sib"><span class="lab">${PNAME[p]}</span><span class="track"><i style="width:${v/5}%;background:${CATC[catOf(v)]}"></i></span><span class="val">${v}</span></div>`).join("")}
function scene(v){
  const haze="#C7C2B5",far=[["#5F7F8C",20,40],["#557584",8,62],["#4A6A78",3,84],["#3E5C69",1,108]];
  const mix=(a,b,f)=>{const pa=a.match(/\w\w/g).map(x=>parseInt(x,16)),pb=b.match(/\w\w/g).map(x=>parseInt(x,16));return "rgb("+pa.map((x,i)=>Math.round(x*(1-f)+pb[i]*f)).join(",")+")"};
  const sky=mix("#7DB8D6",haze,clamp(1-v/25,0,1));
  const ridges=far.map(([c,d,y],i)=>{const f=1-Math.exp(-3.912*d/v);const pts=[];for(let x=0;x<=320;x+=20)pts.push(`${x},${y-10-14*Math.sin(x/37+i*1.7)-8*Math.cos(x/23+i)}`);return `<path d="M0,170 L${pts.join(" L")} L320,170Z" fill="${mix(c.slice(1),haze.slice(1),clamp(f,0,1))}"/>`}).join("");
  const tw=1-Math.exp(-3.912*3/v);
  return `<svg class="scene" viewBox="0 0 320 150" role="img" aria-label="Visibility preview"><rect width="320" height="150" fill="${sky}"/>${ridges}<g fill="${mix("2E4650",haze.slice(1),clamp(tw,0,1))}"><rect x="210" y="58" width="10" height="40"/><rect x="224" y="46" width="12" height="52"/><rect x="240" y="66" width="9" height="32"/></g><rect y="128" width="320" height="22" fill="#3B4F44"/><text x="10" y="18" font-size="11" fill="#fff" opacity=".85">20 km · 8 km · 3 km · 1 km</text></svg>`;
}

function advList(prof,c){return ((S.lang==="hi"&&ADVHI[prof])?ADVHI[prof]:ADV[prof])[c]}

const SENS={pGen:0,pChild:1,pOld:1,pAsth:2,pPreg:1,pWork:0};
function verdictOf(aqi,prof,act){const c=catOf(aqi),s=SENS[prof]||0,h=(act==="vRun"||act==="vPlay")?1:0;
  if(c<=1)return(c===1&&s===2&&h)?1:0;if(c===2)return(s>=2||(s>=1&&h))?1:0;if(c===3)return h?2:1;if(c===4)return(h||s>=1)?2:1;return 2}
function windowFor(pm,aqi){const{b,f}=bestWindow(),ab=subIndex("pm25",pm*f[b]);return{b,ab,better:ab<aqi-15}}

function sayBtn(key,text,lang){SAY[key]=text;SAYL[key]=lang||S.lang;return `<button class="say" data-say="${key}" aria-label="${t("listen")}">🔊 ${t("listen")}</button>`}
function verdictHtml(aqi,prof,act,w){const L=verdictOf(aqi,prof,act),c=catOf(aqi);
  const tip=L===0?t("L0s"):L===1?t("L1s")+(c>=3?t("L1n95"):""):t("L2s");
  const win=L>0&&w.better?` ${t("winBetter")}: ${hh(w.b)}–${hh(w.b+2)} (AQI ≈ ${w.ab}).`:"";
  return {L,html:`<div class="verd v${L}" role="status"><span class="vi" aria-hidden="true">${["✅","⚠️","🏠"][L]}</span><div><b>${t("L"+L)}</b><span>${esc(t(prof))} · ${esc(t(act))} · AQI ${aqi}</span><span>${esc(tip+win)}</span></div></div>`,text:`${t("L"+L)}. ${tip}${win}`}}

  return `<div class="hrow"><h2>${t("goT")}</h2>${sayBtn("adv",say)}</div>${v.html}<div class="impact">${t("imp"+r.cat)}</div><h3 class="h3">${t("doNow")}</h3><ul class="advice">${list.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`}

/* orb particles */
const orb={parts:[],target:null,raf:0};
function orbLoop(){
  const c=$("#orb");if(!c){orb.raf=0;return}
  const g=c.getContext("2d"),W=540,R=232,cx=270,cy=270,r=orb.target||reading();
  const want=Math.round(clamp(r.pm*1.6,10,700));
  while(orb.parts.length<want)orb.parts.push({a:Math.random()*6.283,d:Math.sqrt(Math.random())*R*.94,s:.6+Math.random()*2.6,v:(Math.random()-.5)*.004,dr:(Math.random()-.5)*.25,o:.25+Math.random()*.6});
  if(orb.parts.length>want)orb.parts.length=want;
  g.clearRect(0,0,W,W);
  const col=CATC[r.cat];
  const grd=g.createRadialGradient(cx,cy-60,20,cx,cy,R);grd.addColorStop(0,"rgba(255,255,255,.95)");grd.addColorStop(1,"rgba(232,240,242,.85)");
  g.fillStyle=grd;g.beginPath();g.arc(cx,cy,R,0,6.283);g.fill();
  g.save();g.beginPath();g.arc(cx,cy,R-2,0,6.283);g.clip();
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  for(const p of orb.parts){if(!reduce){p.a+=p.v;p.d+=p.dr;if(p.d>R*.95||p.d<4)p.dr*=-1}
    g.globalAlpha=p.o*(.5+.5*Math.min(1,r.pm/150));g.fillStyle=r.cat>=4?"#4A3A30":r.cat>=3?"#6F5A45":"#7C8A86";
    g.beginPath();g.arc(cx+Math.cos(p.a)*p.d,cy+Math.sin(p.a)*p.d,p.s,0,6.283);g.fill()}
  g.restore();g.globalAlpha=1;
  g.lineWidth=14;g.lineCap="round";g.strokeStyle="rgba(21,38,46,.08)";g.beginPath();g.arc(cx,cy,R+12,0,6.283);g.stroke();
  g.strokeStyle=col;g.beginPath();g.arc(cx,cy,R+12,-1.5708,-1.5708+6.283*clamp(r.aqi/500,0.005,1));g.stroke();
  orb.raf=requestAnimationFrame(orbLoop);
}

function detScores(){
  const d=S.det,sea=d.season||season(),pr=PRIOR[sea];const sc={},why={};
  SRC.forEach(s=>{sc[s]=Math.log(pr[s]);why[s]=[]});
  const keys=[d.time,d.smell,d.sky,...(d.near||[]),d.fest,d.wind].filter(Boolean);
  keys.forEach(k=>{const e=EV[k]||{};for(const s in e){sc[s]+=e[s]*.5;if(e[s]>=1)why[s].push(t(k))}});
  if(pr.stub>=2)why.stub.unshift(t(sea));if(pr.dust>=2)why.dust.unshift(t(sea));
  const mx=Math.max(...SRC.map(s=>sc[s]));let tot=0;SRC.forEach(s=>{sc[s]=Math.exp(sc[s]-mx);tot+=sc[s]});
  return SRC.map(s=>({s,p:sc[s]/tot,why:why[s]})).sort((a,b)=>b.p-a.p);
}

function sim(){const r=reading(),mix=MIX[season()];let cut=0;const after={};
  for(const k in mix){const red=EFF[k]?mix[k]*EFF[k]*(S.levers[k]||0)/100:0;after[k]=mix[k]-red;cut+=red}
  const pm2=r.pm*(1-cut/100);let best=null,bv=0;for(const k in EFF){const v=mix[k]*EFF[k];if(v>bv){bv=v;best=k}}
  return{r,mix,after,pm2,aqi2:subIndex("pm25",pm2),best,bv}}
function viewControl(){

function diur(){const s=season();const a=(s==="sPost"||s==="sWin")?DIUR.win:DIUR.sum;const m=a.reduce((x,y)=>x+y)/24;return a.map(v=>v/m)}

/* ===== ASK core: offline deep search for English, Hindi and Hinglish =====
   BM25 ranking over a bilingual knowledge base, a synonym bridge between
   scripts, phonetic squashing for Hinglish spellings, typo correction and
   on-device speech. No network, no libraries. */
const AskCore=(()=>{
 const DEV="०१२३४५६७८९";
 const digits=s=>String(s).replace(/[०-९]/g,d=>DEV.indexOf(d));
 const STOP=new Set(("the a an is are was were be been of to in on for and or what how why when which who whom do does did i my me we our you your it its this that these those can could should would will shall with at by from as if so than then there their them they he she his her about into any some much many also just please tell me us show give get need want know make one am day days daily week weekly month monthly year yearly each per vs versus use using much "+
  "kya kyaa hai hain he ka ki ke ko se me mein mai main aur ya kaise kaisa kaisi kyon kyu kyun kab kahan kaha kaun kitna kitni kitne batao bataiye bataye karu karun kare karein karna karte karta ho hota hoti hote ek kuch mera meri mere hum aap yeh ye woh wo par pe bhi to tha thi hona sakta sakti sakte chahiye chaiye abhi raha rahi rahe wala wali wale din roz roj rozana saal mahina mahine "+
  "क्या है हैं था थी थे का की के को से में मे और या कैसे कैसा कैसी क्यों क्यो कब कहाँ कहां कौन कितना कितनी कितने बताओ बताइए बताएं बताएँ करूँ करू करें करे करना करते करता हो होता होती होते एक कुछ मैं मेरा मेरी मेरे हम आप यह ये वह वो पर भी तो होना सकता सकती सकते चाहिए अभी रहा रही रहे वाला वाली वाले जी दिन रोज़ रोज रोज़ाना साल महीना महीने हफ़्ते").split(" "));
 // nukta and chandrabindu variants collapse to one spelling
 const norm=s=>digits(String(s)).toLowerCase().normalize("NFC").replace(/़/g,"").replace(/ँ/g,"ं")
   .replace(/[।॥.,!?;:()"'“”‘’\/\\\-–—+*=<>\[\]{}|#@&%^~`₹]/g," ");
 // Hinglish phonetic squash: bachcha / baccha / bacha -> bac a
 const squash=w=>/^[a-z]+$/.test(w)?w.replace(/([bcdfgjkptsr])h/g,"$1").replace(/(.)\1+/g,"$1").replace(/(ee|ii)/g,"i").replace(/(oo|uu)/g,"u").replace(/[aeiou]$/,"a"):w;
 const stem=w=>{if(!/^[a-z]+$/.test(w))return w;
  if(w.length>4&&w.endsWith("ies"))return w.slice(0,-3)+"y";
  if(w.length>5&&w.endsWith("ing"))return w.slice(0,-3);
  if(w.length>4&&w.endsWith("ed"))return w.slice(0,-2);
  if(w.length>3&&w.endsWith("s")&&!w.endsWith("ss"))return w.slice(0,-1);return w};
 function lev(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];let lo=i;for(let j=1;j<=n;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));if(c[j]<lo)lo=c[j]}if(lo>max)return max+1;p=c}return p[n]}
 function Engine(docs,synList){
  this.syn={};this.sq={};
  // synList: {canonical:"word1 word2 ..."}; canonical maps to itself
  for(const can in synList){const all=(can+" "+synList[can]).split(/\s+/).filter(Boolean);
   all.forEach(w=>{const n=norm(w).trim();if(!n)return;this.syn[n]=can;this.syn[stem(n)]=this.syn[stem(n)]||can;this.sq[squash(n)]=this.sq[squash(n)]||can})}
  this.docs=docs;this.df={};this.len=[];this.tf=[];let tot=0;
  docs.forEach((d,i)=>{const toks=[].concat(...[[d.t,3],[d.th,3],[d.k,2],[d.a,1],[d.ah,1]].map(([s,w])=>{const t=this.toks(s||"").map(x=>x.w);let o=[];for(let r=0;r<w;r++)o=o.concat(t);return o}));
   const tf={};toks.forEach(w=>tf[w]=(tf[w]||0)+1);this.tf[i]=tf;this.len[i]=toks.length;tot+=toks.length;Object.keys(tf).forEach(w=>this.df[w]=(this.df[w]||0)+1)});
  this.avg=tot/Math.max(1,docs.length);this.vocab=Object.keys(this.df);
 }
 Engine.prototype.canon=function(raw){const s=stem(raw);return this.syn[raw]||this.syn[s]||this.sq[squash(raw)]||s};
 Engine.prototype.toks=function(s){return norm(s).split(/\s+/).filter(w=>w&&!STOP.has(w)&&!/^\d+$/.test(w)).map(w=>({raw:w,w:this.canon(w)}))};
 Engine.prototype.search=function(q,n){const t0=performance.now();let qt=this.toks(q);const fixed=[];
  qt=qt.map(x=>{if(this.df[x.w]||x.w.length<5||!/^[a-z]+$/.test(x.w))return x;let best=null,bd=9;const max=x.w.length>=7?2:1;
   for(const v of this.vocab){if(v.length<4)continue;const d=lev(x.w,v,max);if(d<=max&&(d<bd||(d===bd&&this.df[v]>this.df[best]))){bd=d;best=v}}
   if(best){fixed.push([x.raw,best]);return{raw:x.raw,w:best}}return x});
  const uniq=[...new Set(qt.map(x=>x.w))],N=this.docs.length,k1=1.4,b=.6;
  const hits=this.docs.map((d,i)=>{let s=0;const m=[];uniq.forEach(w=>{const f=this.tf[i][w];if(!f)return;const idf=Math.log(1+(N-this.df[w]+.5)/(this.df[w]+.5));s+=idf*f*(k1+1)/(f+k1*(1-b+b*this.len[i]/this.avg));m.push(w)});
   if(m.length>1)s*=1+.18*(m.length-1);return{d,s,m}}).filter(h=>h.s>0).sort((a,b)=>b.s-a.s);
  return{terms:uniq,fixed,hits:hits.slice(0,n||6),ms:performance.now()-t0,size:N}};
 // ---- numbers & units
 function num(q,re){const m=digits(q).toLowerCase().match(re);return m?parseFloat(m[1].replace(",",".")):null}
 // ---- speech out (works offline with the phone's built-in voices)
 function speak(text,lang,onEnd){try{const s=window.speechSynthesis;if(!s)return false;s.cancel();const u=new SpeechSynthesisUtterance(String(text).replace(/[★✓•→➜]/g," "));
  u.lang=lang==="hi"?"hi-IN":"en-IN";const vs=s.getVoices()||[];const v=vs.find(v=>(v.lang||"").toLowerCase().replace("_","-")===(lang==="hi"?"hi-in":"en-in"))||vs.find(v=>(v.lang||"").toLowerCase().startsWith(lang==="hi"?"hi":"en"));
  if(v)u.voice=v;u.rate=.95;if(onEnd)u.onend=onEnd;s.speak(u);return true}catch(e){return false}}
 function hush(){try{window.speechSynthesis&&window.speechSynthesis.cancel()}catch(e){}}
 // ---- speech in (browser speech recognition; some phones need internet for it)
 const SR=typeof window!=="undefined"&&(window.SpeechRecognition||window.webkitSpeechRecognition);
 function listen(lang,onText,onErr){if(!SR){onErr&&onErr("none");return null}try{const r=new SR();r.lang=lang==="hi"?"hi-IN":"en-IN";r.interimResults=false;r.maxAlternatives=1;
  r.onresult=e=>onText(e.results[0][0].transcript);r.onerror=e=>onErr&&onErr(e.error||"err");r.start();return r}catch(e){onErr&&onErr("err");return null}}
 return{Engine,norm,digits,num,speak,hush,listen,canListen:!!SR,canSpeak:typeof window!=="undefined"&&"speechSynthesis" in window};
})();

 ah:"ऐसा HEPA प्यूरीफ़ायर चुनें जिसका CADR कमरे के आयतन का कम से कम 5 गुना प्रति घंटा हो। चलते समय दरवाज़े-खिड़कियाँ बंद रखें और समय पर फ़िल्टर बदलें। ओज़ोन बनाने वाले आयनाइज़र से बचें। अपने कमरे का आकार लिखकर पूछें, जैसे 4x3x3।",go:"plan"},
{id:"plants",t:"Do indoor plants clean the air?",th:"क्या घर के पौधे हवा साफ़ करते हैं?",k:"plant plants indoor tulsi money myth",
 a:"Not meaningfully. You would need hundreds of plants in one room to match a small purifier. Plants are good for you in other ways, but they are not air cleaners.",
 ah:"असरदार रूप से नहीं। एक छोटे प्यूरीफ़ायर जितना असर पाने के लिए एक कमरे में सैकड़ों पौधे चाहिए। पौधे दूसरे तरीक़ों से अच्छे हैं, पर एयर क्लीनर नहीं।"},
{id:"tower",t:"Can smog towers clean a city?",th:"क्या स्मॉग टावर शहर साफ़ कर सकते हैं?",k:"smog tower gun anti myth",
 a:"No. A tower cleans only a small zone around it while polluted air keeps flowing in. Cutting emissions at their source works far better.",
 ah:"नहीं। टावर केवल अपने आसपास का छोटा क्षेत्र साफ़ करता है, जबकि प्रदूषित हवा लगातार आती रहती है। स्रोत पर उत्सर्जन घटाना कहीं ज़्यादा असरदार है।"},
{id:"winter",t:"Why is winter air so bad?",th:"सर्दियों में हवा इतनी ख़राब क्यों होती है?",k:"winter cold inversion fog season mausam why weather wind mixing november",
 a:"In winter, cold air near the ground gets trapped under warmer air (an inversion), winds are weak and the mixing layer is low, so smoke stays close to us. Crop fires in October–November and heating fires add more. Monsoon rain washes the air clean.",
 ah:"सर्दियों में ज़मीन के पास ठंडी हवा ऊपर की गर्म हवा के नीचे फँस जाती है (इन्वर्ज़न), हवा धीमी होती है और मिश्रण परत नीची रहती है, इसलिए धुआँ हमारे पास ही रहता है। अक्टूबर–नवंबर में पराली और सर्दी में अलाव इसे और बढ़ाते हैं। मानसून की बारिश हवा धो देती है।"},
{id:"morning",t:"Is a winter morning walk healthy?",th:"क्या सर्दियों में सुबह की सैर अच्छी है?",k:"morning walk subah sair exercise time best when kab winter",
 a:"On smoggy winter days, early morning is often the dirtiest time because the inversion traps smoke until mid-morning. Afternoons are usually cleaner. The Plan tab shows your cleanest window.",
 ah:"धुंध वाली सर्दियों में सुबह-सुबह अक्सर सबसे गंदी हवा होती है, क्योंकि इन्वर्ज़न सुबह देर तक धुआँ रोके रखता है। दोपहर आमतौर पर साफ़ होती है। 'योजना' टैब आपका सबसे साफ़ समय दिखाता है।",go:"plan"},
{id:"exercise",t:"Exercising on polluted days",th:"प्रदूषण वाले दिनों में व्यायाम",k:"exercise run running gym sport cricket football workout",
 a:"Hard exercise makes you breathe several times more air. Above AQI 200, move running and sports indoors or to the cleanest hours, and keep it lighter. Above 300, avoid outdoor exertion.",
 ah:"कड़ा व्यायाम करने पर आप कई गुना ज़्यादा हवा साँस में लेते हैं। AQI 200 से ऊपर दौड़ और खेल घर के अंदर या सबसे साफ़ समय में, और हल्के करें। 300 से ऊपर बाहर मेहनत से बचें।",go:"plan"},
{id:"stubble",t:"Crop-residue (stubble) burning",th:"पराली जलाना",k:"stubble parali crop residue farm fire punjab haryana paddy happy seeder decomposer",
 a:"After the paddy harvest in October–November, fields are burnt to clear stubble. Alternatives include the Happy Seeder, bio-decomposer sprays and selling residue for fuel. On peak days, farm fires can add a large share of the city's PM2.5.",
 ah:"अक्टूबर–नवंबर में धान कटाई के बाद पराली साफ़ करने के लिए खेत जलाए जाते हैं। विकल्प हैं हैप्पी सीडर, बायो-डीकंपोज़र का छिड़काव और पराली को ईंधन के लिए बेचना। चरम दिनों में खेतों की आग शहर के PM2.5 का बड़ा हिस्सा बन सकती है।",go:"detect"},
{id:"crackers",t:"Firecrackers and Diwali air",th:"पटाख़े और दिवाली की हवा",k:"firecracker diwali festival green cracker celebration",
 a:"One night of heavy cracker bursting can push the AQI to Severe, and the smoke carries metals. Green crackers from CSIR-NEERI emit about 30% less, but no cracker is clean. Celebrate with lights and community events.",
 ah:"एक रात की भारी आतिशबाज़ी AQI को 'गंभीर' तक पहुँचा सकती है, और उसके धुएँ में धातुएँ होती हैं। CSIR-NEERI के ग्रीन पटाख़े लगभग 30% कम प्रदूषण करते हैं, पर कोई पटाख़ा साफ़ नहीं है। रोशनी और सामुदायिक कार्यक्रमों से त्योहार मनाएँ।"},
{id:"vehicles",t:"Vehicles: what helps",th:"वाहन: क्या मदद करता है",k:"vehicle car bike scooter diesel petrol exhaust puc idling traffic bs6 ev metro bus",
 a:"Keep the PUC certificate valid, service the engine, switch off at signals and keep tyres inflated. Metro, bus, walking, cycling and carpooling cut exhaust the most. BS-VI and electric vehicles emit far less at the tailpipe.",
 ah:"PUC प्रमाणपत्र वैध रखें, इंजन की सर्विस कराएँ, सिग्नल पर इंजन बंद करें और टायरों में हवा पूरी रखें। मेट्रो, बस, पैदल, साइकिल और कारपूल सबसे ज़्यादा धुआँ घटाते हैं। BS-VI और इलेक्ट्रिक वाहन कहीं कम उत्सर्जन करते हैं।"},
{id:"dust",t:"Road and construction dust",th:"सड़क और निर्माण की धूल",k:"dust construction road building site cement debris malba sweep",
 a:"Dust rises from bare soil, unpaved roads and building sites, especially in dry summer winds. Rules require covering material, wetting sites and using anti-smog guns. At home, wet-mop instead of dry sweeping.",
 ah:"धूल खुली मिट्टी, कच्ची सड़कों और निर्माण स्थलों से उठती है, ख़ासकर गर्मियों की सूखी हवा में। नियमों के अनुसार मलबा ढकना, साइट पर पानी छिड़कना और एंटी-स्मॉग गन चलाना ज़रूरी है। घर पर सूखी झाड़ू की जगह गीला पोछा लगाएँ।",go:"detect"},
{id:"waste",t:"Open waste burning",th:"खुले में कूड़ा जलाना",k:"waste garbage burning landfill leaves plastic burn",
 a:"Burning garbage, leaves and plastic releases fine smoke and toxic gases close to homes, and it is banned. Segregate wet and dry waste, compost leaves and report burning to your municipal helpline.",
 ah:"कूड़ा, पत्तियाँ और प्लास्टिक जलाने से घरों के पास बारीक धुआँ और ज़हरीली गैसें निकलती हैं, और यह प्रतिबंधित है। गीला-सूखा कूड़ा अलग करें, पत्तियों की खाद बनाएँ और जलाने की शिकायत नगर निगम हेल्पलाइन पर करें।",go:"detect"},
{id:"industry",t:"Industry and power plants",th:"उद्योग और बिजलीघर",k:"industry factory power plant chimney stack coal scrubber fgd png",
 a:"Coal plants and factories emit SO₂, NO₂ and particles. Scrubbers (FGD), continuous emission monitoring and a shift to piped gas (PNG) cut these emissions. Report night-time smoke with a photo, time and place.",
 ah:"कोयला बिजलीघर और कारख़ाने SO₂, NO₂ और कण छोड़ते हैं। स्क्रबर (FGD), लगातार उत्सर्जन निगरानी और पाइप गैस (PNG) अपनाने से यह घटता है। रात में निकलते धुएँ की शिकायत फ़ोटो, समय और स्थान के साथ करें।",go:"detect"},
{id:"home",t:"Indoor air at home",th:"घर के अंदर की हवा",k:"indoor home ghar incense agarbatti mosquito coil frying kitchen ventilation window",
 a:"Incense, mosquito coils, frying, candles and kerosene make indoor PM2.5 spike. On bad days keep windows shut, use an exhaust fan while cooking and air the house in the cleanest afternoon hours.",
 ah:"अगरबत्ती, मच्छर कॉइल, तलना, मोमबत्ती और केरोसिन घर में PM2.5 बढ़ाते हैं। ख़राब दिनों में खिड़कियाँ बंद रखें, खाना बनाते समय एग्ज़ॉस्ट चलाएँ और दोपहर के सबसे साफ़ समय में घर हवादार करें।"},
{id:"fuel",t:"Clean cooking fuel",th:"स्वच्छ खाना पकाने का ईंधन",k:"lpg chulha wood coal cooking fuel ujjwala gas stove induction",
 a:"Wood, dung and coal stoves fill homes with smoke that hurts women and children most. LPG, PNG and induction are far cleaner; the Ujjwala scheme has given over 10 crore LPG connections.",
 ah:"लकड़ी, उपले और कोयले के चूल्हे घर को धुएँ से भर देते हैं, जिसका सबसे ज़्यादा असर महिलाओं और बच्चों पर होता है। LPG, PNG और इंडक्शन कहीं साफ़ हैं; उज्ज्वला योजना से 10 करोड़ से ज़्यादा LPG कनेक्शन दिए गए हैं।"},
{id:"health",t:"How pollution harms health",th:"प्रदूषण सेहत को कैसे नुकसान पहुँचाता है",k:"health disease effect harm heart stroke lung diabetes cancer damage nuksan",
 a:"PM2.5 inflames the lungs and enters the blood. It raises the risk of heart attack, stroke, lung disease, diabetes and lung cancer, and of low birth weight in babies. In India it was linked to about 2.1 million deaths in 2021.",
 ah:"PM2.5 फेफड़ों में सूजन पैदा करता है और ख़ून में पहुँचता है। इससे हृदयाघात, स्ट्रोक, फेफड़ों की बीमारी, मधुमेह और फेफड़ों के कैंसर का जोखिम, और शिशुओं में कम जन्म-भार का ख़तरा बढ़ता है। भारत में 2021 में लगभग 21 लाख मौतें इससे जुड़ी थीं।"},
{id:"doctor",t:"When to see a doctor",th:"डॉक्टर से कब मिलें",k:"doctor symptom cough wheeze breathless chest pain hospital emergency inhaler",
 a:"Seek care for breathlessness, chest pain or tightness, wheezing, a cough that won't settle, or if you need your reliever inhaler more than usual. This app gives general guidance, not medical advice.",
 ah:"साँस फूलने, सीने में दर्द या जकड़न, घरघराहट, लगातार खाँसी, या सामान्य से ज़्यादा रिलीवर इनहेलर लगने पर डॉक्टर से मिलें। यह ऐप सामान्य मार्गदर्शन देता है, चिकित्सा सलाह नहीं।"},
{id:"child",t:"Protecting children",th:"बच्चों की सुरक्षा",k:"child children school play outside kid baby",
 a:"Children breathe more air for their size and their lungs are still growing. Above AQI 200, move play indoors; above 300, keep them inside in the cleanest room. A child-size N95 helps on the way to school.",
 ah:"बच्चे अपने आकार के हिसाब से ज़्यादा हवा लेते हैं और उनके फेफड़े अभी बढ़ रहे होते हैं। AQI 200 से ऊपर खेल घर के अंदर करें; 300 से ऊपर उन्हें सबसे साफ़ कमरे में रखें। स्कूल जाते समय बच्चों के आकार का N95 मदद करता है।",go:"air"},
{id:"asthma",t:"Asthma and heart patients",th:"दमा और हृदय रोगी",k:"asthma heart patient inhaler copd bp",
 a:"Follow your action plan, take preventer medicines as prescribed and keep the reliever inhaler close. Avoid outdoor exertion above AQI 200 and get help early if symptoms worsen.",
 ah:"अपनी एक्शन प्लान मानें, प्रिवेंटर दवा समय पर लें और रिलीवर इनहेलर पास रखें। AQI 200 से ऊपर बाहर मेहनत न करें और लक्षण बढ़ें तो जल्दी डॉक्टर से मिलें।",go:"air"},
{id:"preg",t:"Pregnancy and polluted air",th:"गर्भावस्था और प्रदूषित हवा",k:"pregnant pregnancy baby mother",
 a:"High PM2.5 is linked to low birth weight and early birth. Prefer green, low-traffic routes, avoid exertion on bad days and use a purifier where you sleep.",
 ah:"ज़्यादा PM2.5 का संबंध कम जन्म-भार और समय से पहले जन्म से है। हरे-भरे, कम ट्रैफ़िक वाले रास्ते चुनें, ख़राब दिनों में मेहनत से बचें और सोने के कमरे में प्यूरीफ़ायर चलाएँ।",go:"air"},
{id:"elder",t:"Older adults",th:"बुज़ुर्ग",k:"elder elderly old senior grandparent",
 a:"Older adults have more heart and lung risk. On Poor days, walk indoors or in the afternoon window, keep medicines handy and watch blood pressure and breathing.",
 ah:"बुज़ुर्गों में हृदय और फेफड़ों का जोखिम ज़्यादा होता है। 'ख़राब' दिनों में घर में या दोपहर में टहलें, दवाइयाँ पास रखें और BP व साँस पर नज़र रखें।",go:"air"},
{id:"worker",t:"Outdoor workers",th:"बाहर काम करने वाले",k:"worker labour labor guard delivery traffic police vendor construction shift",
 a:"Traffic police, guards, delivery riders and construction workers face the highest doses. N95 masks, shorter shifts and indoor rest breaks help, and under GRAP employers must control dust on site.",
 ah:"ट्रैफ़िक पुलिस, गार्ड, डिलीवरी राइडर और निर्माण मज़दूर सबसे ज़्यादा प्रदूषण झेलते हैं। N95, छोटी पालियाँ और अंदर विश्राम मदद करते हैं, और GRAP में साइट पर धूल रोकना नियोक्ता की ज़िम्मेदारी है।",go:"air"},
{id:"car",t:"Inside a car",th:"कार के अंदर",k:"car ac recirculate cabin filter drive",
 a:"In traffic, keep windows up and set the AC to recirculate; a good cabin filter cuts the PM2.5 you breathe a lot. Open windows behind trucks and buses bring exhaust straight in.",
 ah:"ट्रैफ़िक में शीशे बंद रखें और AC को रीसर्कुलेट पर रखें; अच्छा केबिन फ़िल्टर साँस वाले PM2.5 को काफ़ी घटाता है। ट्रक और बस के पीछे खुली खिड़कियाँ धुआँ सीधे अंदर लाती हैं।"},
{id:"fog",t:"Fog or smog?",th:"कोहरा या स्मॉग?",k:"fog smog mist haze kohra dhund difference",
 a:"Fog is water droplets and feels damp and white. Smog is smoke and particles: it looks brownish or grey, smells of burning and stings the eyes. Humidity makes particles swell, which is why SAANS asks how the air feels.",
 ah:"कोहरा पानी की बूँदें है, जो नम और सफ़ेद लगता है। स्मॉग धुआँ और कण है: भूरा या धूसर दिखता है, जलने की गंध आती है और आँखें जलती हैं। नमी से कण फूलते हैं, इसीलिए SAANS पूछता है कि हवा कैसी लगती है।",go:"air"},
{id:"skyeye",t:"How Sky-eye estimates PM2.5",th:"आसमान-दृष्टि PM2.5 कैसे निकालती है",k:"sky eye visibility koschmieder estimate without sensor how work",
 a:"Particles scatter light, so the dirtier the air, the shorter you can see. Sky-eye uses the Koschmieder relation b = 3.912 / V, subtracts clean-air scattering and divides by a humidity-adjusted factor. It is about ±35% accurate.",
 ah:"कण प्रकाश बिखेरते हैं, इसलिए हवा जितनी गंदी, दृश्यता उतनी कम। आसमान-दृष्टि कोशमीडर सूत्र b = 3.912 / V से प्रकाश-विलोपन निकालती है, साफ़ हवा का हिस्सा घटाती है और नमी के अनुसार बँटती है। सटीकता लगभग ±35% है।",go:"air"},
{id:"detective",t:"How the source detective reasons",th:"स्रोत जासूस कैसे सोचता है",k:"source detective bayes reason evidence probability how work smell",
 a:"It starts from how likely each source is in this season, then multiplies by the weight of every clue you give: smell, haze colour, time, what's nearby. The scores become percentages, and the clues behind them are listed.",
 ah:"यह पहले देखता है कि इस मौसम में हर स्रोत कितना संभावित है, फिर आपके हर सुराग (गंध, धुंध का रंग, समय, आसपास क्या है) के भार से गुणा करता है। अंकों को प्रतिशत में बदलकर उनके पीछे के सुराग दिखाता है।",go:"detect"},
{id:"control",t:"How the control lab works",th:"नियंत्रण प्रयोगशाला कैसे काम करती है",k:"control lab simulator lever policy city how work",
 a:"Each source's seasonal share is reduced by how much a measure is adopted times how well it works. The remaining PM2.5 is converted back to AQI. It is a teaching model, not a forecast.",
 ah:"हर स्रोत के मौसमी हिस्से को इस अनुपात में घटाया जाता है कि उपाय कितना अपनाया गया और कितना असरदार है। बचा हुआ PM2.5 वापस AQI में बदला जाता है। यह सीखने का मॉडल है, भविष्यवाणी नहीं।",go:"control"},
{id:"dose",t:"Your daily dose",th:"आपकी रोज़ की ख़ुराक",k:"dose inhale breathe exposure how much",
 a:"Dose = PM2.5 × hour-of-day factor × room factor × breathing rate × (1 − mask efficiency) × hours. Running breathes about six times more air than sitting, so timing your exercise matters.",
 ah:"ख़ुराक = PM2.5 × घंटे का कारक × कमरे का कारक × साँस की दर × (1 − मास्क दक्षता) × घंटे। दौड़ते समय बैठने से लगभग छह गुना ज़्यादा हवा जाती है, इसलिए व्यायाम का समय मायने रखता है।",go:"plan"},
{id:"cig",t:"Cigarette equivalent",th:"सिगरेट के बराबर",k:"cigarette smoking sigret smoke equal",

  let html=(calc.und.length||words.length||res.fixed.length)?`<div class="und"><b>${t("undT")}:</b>${calc.und.map(x=>`<span class="ent">${esc(x)}</span>`).join("")}${words.slice(0,5).map(w=>raw[w]||w).filter(w=>!calc.und.some(u=>String(u).toLowerCase().includes(w.toLowerCase()))).map(w=>`<span class="ent w">${esc(w)}</span>`).join("")}${res.fixed.map(([a,b])=>`<span class="ent fix">${t("fixT")}: ${esc(a)} → ${esc(b)}</span>`).join("")}</div>`:"";
  html+=calc.out.join("");
  if(good){const A=hi?top.d.ah:top.d.a,T1=hi?top.d.th:top.d.t;
    html+=`<section class="panel ans"><div class="kind">${calc.out.length?t("askAbout"):t("bestT")}</div><h2 style="margin-top:4px">${esc(T1)}</h2><p>${esc(A)}</p><div class="acts">${top.d.go?`<button class="btn sm ghost" data-goto="${top.d.go}">${t("openTab")}: ${t(TABS.find(x=>x[0]===top.d.go)[1])}</button>`:""}${sayBtn("kb0",T1+". "+A,aL)}</div>
    ${rel.length?`<h3 class="h3" style="margin-top:14px">${t("relT")}</h3>${rel.map((h,i)=>`<details class="rel"><summary>${esc(hi?h.d.th:h.d.t)}</summary><p>${esc(hi?h.d.ah:h.d.a)}</p><div class="acts">${sayBtn("kb"+(i+1),(hi?h.d.th:h.d.t)+". "+(hi?h.d.ah:h.d.a),aL)}</div></details>`).join("")}`:""}</section>`}
  if(!good&&!calc.out.length)html+=`<section class="panel"><p>${t("noHit")}</p></section>${askIdle()}`;
  html+=`<p class="stat">🔒 ${t("statT").replace("{n}",res.size).replace("{ms}",Math.max(1,Math.round(res.ms)))}</p>`;
  S.lang=keep;out.innerHTML=html;
  if(good||calc.out.length){S.askHist=[q,...S.askHist.filter(x=>x!==q)].slice(0,5)}save()}
function viewAsk(){return `<div class="view"><h1>${t("askH")}</h1><p class="sub">${t("askS")}</p>
  <div class="askbox"><input type="search" id="askIn" enterkeyhint="search" autocomplete="off" placeholder="${esc(t("askPh"))}" value="${esc(S.askQ||"")}" aria-label="${t("askH")}">
   <button class="ibtn" id="askMic" aria-label="${t("micOn")}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
   <button class="ibtn go" id="askGo" aria-label="${t("tAsk")}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
  <div id="askOut"></div></div>`}
/* quick tour */
function showTour(i){i=i||0;let el=$("#tour");if(!el){el=document.createElement("div");el.id="tour";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");document.body.appendChild(el)}
  const ill=["🌫️","💬","🧭"][i];el.innerHTML=`<div class="card"><div class="dots">${[0,1,2].map(k=>`<i class="${k===i?"on":""}"></i>`).join("")}</div><div class="ill" aria-hidden="true">${ill}</div><h2>${t("tour"+(i+1)+"H")}</h2><p>${t("tour"+(i+1))}</p>
  <div class="row" style="margin-top:16px;justify-content:space-between"><button class="btn ghost" data-tour="x">${t("skip")}</button><button class="btn" data-tour="${i<2?i+1:"x"}">${i<2?t("next"):t("start")}</button></div></div>`;
  const b=el.querySelector('[data-tour]:last-child');if(b)b.focus()}
function endTour(){const el=$("#tour");if(el)el.remove();S.toured=true;save()}
let REC=null;
function micStart(){const b=$("#askMic");if(REC){try{REC.stop()}catch(x){}REC=null;b&&b.classList.remove("rec");return}
  if(!AskCore.canListen)return toast(t("micNo"));b&&b.classList.add("rec");toast(t("micOn"));
  REC=AskCore.listen(S.lang,txt=>{REC=null;b&&b.classList.remove("rec");$("#askIn").value=txt;askRun(txt)},err=>{REC=null;b&&b.classList.remove("rec");toast(err==="network"||err==="service-not-allowed"?t("micNet"):t("micNo"))})}
let SPK=null;
function sayToggle(btn){const k=btn.dataset.say;if(SPK===btn){AskCore.hush();btn.classList.remove("on");btn.textContent="🔊 "+t("listen");SPK=null;return}
  if(SPK){SPK.classList.remove("on");SPK.textContent="🔊 "+t("listen")}
  const ok=AskCore.speak(SAY[k]||"",SAYL[k]||S.lang,()=>{btn.classList.remove("on");btn.textContent="🔊 "+t("listen");if(SPK===btn)SPK=null});
  if(!ok)return toast(t("noVoice"));SPK=btn;btn.classList.add("on");btn.textContent="■ "+t("stop")}
/* ---------- router & events ---------- */
const VIEWS={air:viewAir,detect:viewDetect,ask:viewAsk,control:viewControl,plan:viewPlan,act:viewAct};
function render(){renderTabs();document.documentElement.lang=S.lang==="hi"?"hi":"en";$("#lang").textContent=S.lang==="hi"?"EN":"हिं";
  AskCore.hush();SPK=null;document.documentElement.classList.toggle("big",!!S.big);$("#bigT").setAttribute("aria-pressed",!!S.big);
  $("#view").innerHTML=VIEWS[S.tab]();applyMood(reading());if(S.tab==="air"){orb.target=reading();if(!orb.raf)orb.raf=requestAnimationFrame(orbLoop)}
  if(S.tab==="ask")askRun(S.askQ);net();save()}
function go(tab){S.tab=tab;try{history.replaceState(null,"","#"+tab)}catch(e){}render();window.scrollTo({top:0})}
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}
function net(){$("#net").textContent=navigator.onLine?t("online"):t("offline")}
addEventListener("online",net);addEventListener("offline",net);
$("#lang").onclick=()=>{S.lang=S.lang==="hi"?"en":"hi";render()};
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-tab],[data-mode],[data-g],[data-preset],[data-act],[data-myth],[data-del],#addRow,#copyC,#saveC,[data-ask],[data-say],[data-use],[data-goto],[data-roomgo],[data-tour],#askGo,#askMic,#bigT,#helpT");if(!el)return;
  if(el.dataset.tab)return go(el.dataset.tab);
  if(el.dataset.tour!=null){return el.dataset.tour==="x"?endTour():showTour(+el.dataset.tour)}
  if(el.dataset.ask!=null){$("#askIn").value=el.dataset.ask;return askRun(el.dataset.ask)}
  if(el.id==="askGo"){const v=$("#askIn").value;$("#askIn").blur();return askRun(v)}
  if(el.id==="askMic")return micStart();
  if(el.dataset.say)return sayToggle(el);
  if(el.dataset.use){S.mode="dial";S.aqi=+el.dataset.use;save();toast(t("usedAqi"));return go("air")}
  if(el.dataset.goto)return go(el.dataset.goto);
  if(el.dataset.roomgo){S.room=el.dataset.roomgo.split(",").map(Number);return go("plan")}
  if(el.id==="bigT"){S.big=!S.big;toast(S.big?t("bigOn"):t("bigOff"));return render()}
  if(el.id==="helpT")return showTour(0);
  if(el.dataset.mode){S.mode=el.dataset.mode;return render()}
  if(el.dataset.g){const g=el.dataset.g,v=el.dataset.v;
    if(g==="profile"){S.profile=v;save();document.querySelectorAll('[data-g="profile"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));return updAir()}
    if(g==="actv"){S.actv=v;save();document.querySelectorAll('[data-g="actv"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));return updAir()}
    if(g==="rh"){S.rh=v;save();document.querySelectorAll('[data-g="rh"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));return updAir()}
    if(g==="near"){const a=S.det.near||[];S.det.near=a.includes(v)?a.filter(x=>x!==v):[...a,v]}else S.det[g]=S.det[g]===v&&g!=="season"?null:v;
    document.querySelectorAll(`[data-g="${g}"]`).forEach(b=>b.setAttribute("aria-pressed",g==="near"?S.det.near.includes(b.dataset.v):b.dataset.v===S.det[g]));
    $("#detRes").innerHTML=detResult();$("#cmp").value=complaint();return save()}
  if(el.dataset.preset){Object.assign(S.levers,PRESET[el.dataset.preset]);return render()}
  if(el.dataset.act)return toggleAct(el);
  if(el.dataset.myth!=null){el.classList.toggle("flip");S.myths[el.dataset.myth]=el.classList.contains("flip");return save()}
  if(el.dataset.del!=null){S.day.splice(+el.dataset.del,1);$("#rows").innerHTML=rowsHtml();$("#doseBox").innerHTML=doseHtml();return save()}
  if(el.id==="addRow"){S.day.push({h:16,d:1,a:"aWalk",w:"wOut",m:"mkNone"});$("#rows").innerHTML=rowsHtml();$("#doseBox").innerHTML=doseHtml();return save()}
  if(el.id==="copyC"){const v=$("#cmp").value;try{navigator.clipboard.writeText(v).then(()=>toast(t("copied")),()=>{$("#cmp").select();toast(t("copyFail"))})}catch(x){$("#cmp").select();toast(t("copyFail"))}return}
  if(el.id==="saveC"){const top=detScores()[0];S.reports.push({when:new Date().toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"}),src:T.en[SRCK[top.s]],loc:S.det.loc||"",text:$("#cmp").value});save();$("#savedList").innerHTML=savedHtml();return toast(t("savedOk"))}
});
function toggleAct(el){const k=el.dataset.act,d=today(),a=S.hist[d]||[];S.hist[d]=a.includes(k)?a.filter(x=>x!==k):[...a,k];save();render();const n=document.querySelector(`[data-act="${k}"]`);if(n)n.focus()}
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-act],[data-myth]")){e.preventDefault();e.target.click()}
  if(e.key==="Enter"&&e.target.id==="askIn"){e.preventDefault();e.target.blur();askRun(e.target.value)}
  if(e.key==="Escape"&&$("#tour"))endTour()});
document.addEventListener("input",e=>{const el=e.target;
  if(el.id==="dial"||el.id==="dialN"){S.aqi=clamp(parseInt(el.value)||0,0,500);const o=el.id==="dial"?$("#dialN"):$("#dial");o.value=S.aqi;updAir();return save()}
  if(el.dataset.pol){S.meter[el.dataset.pol]=el.value;updAir();return save()}
  if(el.id==="visR"){S.vis=+(0.2*Math.pow(250,el.value/100)).toFixed(2);$("#visV").textContent=(S.vis<1?S.vis.toFixed(1):Math.round(S.vis))+" km";const sc=document.querySelector(".scene");sc.outerHTML=scene(S.vis);updAir();return save()}
  if(el.dataset.lever){S.levers[el.dataset.lever]=+el.value;$("#lv_"+el.dataset.lever).textContent=el.value+"%";$("#simTop").innerHTML=simTop();return save()}
  if(el.dataset.row!=null){const r=S.day[+el.dataset.row],k=el.dataset.k;r[k]=(k==="h"||k==="d")?+el.value:el.value;$("#doseBox").innerHTML=doseHtml();return save()}
  if(el.dataset.room!=null){S.room[+el.dataset.room]=clamp(+el.value||1,1,30);$("#cadr").innerHTML=cadrHtml();return save()}
  if(el.id==="locIn"){S.det.loc=el.value;$("#cmp").value=complaint();return save()}
});
const h0=(location.hash||"").slice(1);if(VIEWS[h0])S.tab=h0;
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==S.tab)go(h)});
render();
let EMB=false;try{EMB=window.self!==window.top}catch(e){EMB=true}
if(!S.toured&&!EMB)showTour(0);

</script>
</body>
